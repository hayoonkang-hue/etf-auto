name: ETF Daily Briefing Automation

on:
  schedule:
    # 한국 시간(KST) 아침 7시 = UTC 밤 10시 (22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pykrx requests googletrans==4.0.0-rc1

    - name: 파이썬 스크립트 실행
      run: |
        python etf_briefing.py
