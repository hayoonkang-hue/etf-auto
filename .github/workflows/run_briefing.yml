name: ETF Daily Briefing Automation

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: 

permissions:
  contents: write  # 파일을 저장할 수 있는 권한 추가

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pykrx requests googletrans==4.0.0-rc1

    - name: 파이썬 스크립트 실행
      run: |
        python etf_briefing.py

    - name: 생성된 파일 깃허브에 저장하기
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Auto-generated ETF Briefing [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
        git push
